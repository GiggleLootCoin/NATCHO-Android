name: Build NATCHO APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - "downloads/NATCHO.apk"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct APK
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/NATCHO.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/NATCHO.apk
          git diff --cached --quiet && exit 0
          git commit -m "Publish verified NATCHO APK [skip ci]"
          git push origin HEAD:main
      - name: Upload APK to Gofile
        id: gofile
        run: |
          set -e
          RESPONSE=$(curl --fail --silent --show-error \
            -X POST \
            -F "file=@app/build/outputs/apk/debug/app-debug.apk" \
            https://upload-na-nyc.gofile.io/uploadfile)
          echo "$RESPONSE" | tee gofile-response.json
          LINK=$(python3 -c 'import json,sys; d=json.load(open("gofile-response.json")); print(d["data"]["downloadPage"])')
          echo "GOFILE_LINK=$LINK" >> "$GITHUB_ENV"
          {
            echo "## NATCHO APK — Gofile"
            echo
            echo "$LINK"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false
          retention-days: 90
          if-no-files-found: error
